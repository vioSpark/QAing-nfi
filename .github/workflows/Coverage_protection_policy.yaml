name: Coverage protection policy

# Merging a branch into main may not lower line coverage (tools/coverage_protection_policy.py).
on:
  pull_request:
  workflow_dispatch:

jobs:
  coverage-merge:
    runs-on: ubuntu-latest

    steps:
    # Full history: on a workflow_dispatch the merge below needs origin/main and the common ancestor.
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    # On a pull_request GitHub already made this merge commit, and checkout checked it out.
    - name: Merge main into the dispatched commit
      if: ${{ github.event_name == 'workflow_dispatch' }}
      run: git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" merge --no-ff --no-edit origin/main

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: python -m pip install -r "Create automated test/requirements.txt"

    # All tests must pass on the merge.
    - name: Run pytest with coverage
      id: tests
      run: python -m coverage run -m pytest "Create automated test"

    # Also when tests fail: their coverage is still worth a look.
    - name: Write coverage-merge.xml (Cobertura)
      if: ${{ success() || steps.tests.outcome == 'failure' }}
      run: python -m coverage xml -o coverage-merge.xml

    # Unzipped, so download-artifact doesn't unzip it: its unzip code still uses the deprecated Buffer()
    # (actions/download-artifact#484). An unzipped artifact is named after its file.
    - name: Upload coverage-merge.xml
      if: ${{ success() || steps.tests.outcome == 'failure' }}
      uses: actions/upload-artifact@v7
      with:
        path: coverage-merge.xml
        archive: false
        if-no-files-found: error
        retention-days: 7

    # .NET is on the runner. ReportGenerator exits 0 when it can't find a source file, so its log is checked.
    # Its headline counts a partly covered line as covered; the policy's own figure is in enforce-policy's log.
    - name: Line-by-line coverage report (ReportGenerator)
      if: ${{ success() || steps.tests.outcome == 'failure' }}
      shell: bash
      run: |
        dotnet tool install dotnet-reportgenerator-globaltool --version 5.5.11 --tool-path "$RUNNER_TEMP/reportgenerator"
        "$RUNNER_TEMP/reportgenerator/reportgenerator" "-reports:coverage-merge.xml" "-sourcedirs:$GITHUB_WORKSPACE" \
          "-targetdir:coverage-report-merge" "-reporttypes:Html" \
          "-title:QAing-nfi: branch_head merged into main_head ($(git rev-parse --short HEAD))" | tee "$RUNNER_TEMP/reportgenerator.log"
        ! grep "does not exist" "$RUNNER_TEMP/reportgenerator.log"

    # The per-file pages are named ._py*.html.
    - name: Upload coverage-report-merge
      if: ${{ success() || steps.tests.outcome == 'failure' }}
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report-merge
        path: coverage-report-merge/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7

  # This job could be a matrix with coverage-merge, but the if-statements would make the CI pipeline hard to
  # understand, which a CI pipeline should not be.
  coverage-main_head:
    runs-on: ubuntu-latest

    steps:
    # Full history: main_head is checked out below.
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    # main_head is measured with the settings and dependencies of the commit under test: main may not have them yet.
    - name: Coverage settings from the commit under test
      run: |
        cp .coveragerc "$RUNNER_TEMP/.coveragerc"
        cp "Create automated test/requirements.txt" "$RUNNER_TEMP/requirements.txt"
        echo "COVERAGE_RCFILE=$RUNNER_TEMP/.coveragerc" >> "$GITHUB_ENV"

    # The merge commit's first parent on a pull_request, the latest main on a workflow_dispatch.
    - name: Check out main_head
      run: git checkout --detach "${{ github.event_name == 'pull_request' && 'HEAD^1' || 'origin/main' }}"

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: python -m pip install -r "$RUNNER_TEMP/requirements.txt"

    # On main_head a failing test neither stops the measurement nor turns the check red: only its coverage is used.
    - name: Run pytest with coverage
      id: tests
      continue-on-error: true
      run: python -m coverage run -m pytest "Create automated test"

    - name: Warn about failing tests on main_head
      if: ${{ steps.tests.outcome == 'failure' }}
      run: echo "::warning::Tests fail on main_head ($(git rev-parse --short HEAD)); its coverage is still used."

    - name: Write coverage-main_head.xml (Cobertura)
      run: python -m coverage xml -o coverage-main_head.xml

    # Unzipped, as in coverage-merge.
    - name: Upload coverage-main_head.xml
      uses: actions/upload-artifact@v7
      with:
        path: coverage-main_head.xml
        archive: false
        if-no-files-found: error
        retention-days: 7

    # As in coverage-merge; the sources are main_head's.
    - name: Line-by-line coverage report (ReportGenerator)
      shell: bash
      run: |
        dotnet tool install dotnet-reportgenerator-globaltool --version 5.5.11 --tool-path "$RUNNER_TEMP/reportgenerator"
        "$RUNNER_TEMP/reportgenerator/reportgenerator" "-reports:coverage-main_head.xml" "-sourcedirs:$GITHUB_WORKSPACE" \
          "-targetdir:coverage-report-main_head" "-reporttypes:Html" \
          "-title:QAing-nfi: main_head ($(git rev-parse --short HEAD))" | tee "$RUNNER_TEMP/reportgenerator.log"
        ! grep "does not exist" "$RUNNER_TEMP/reportgenerator.log"

    - name: Upload coverage-report-main_head
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report-main_head
        path: coverage-report-main_head/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7

  enforce-policy:
    needs: [coverage-merge, coverage-main_head]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    # With merge-multiple the two files land in the workspace itself, not in a folder per artifact.
    - name: Download both coverage files
      uses: actions/download-artifact@v8
      with:
        pattern: coverage-*.xml
        merge-multiple: true

    - name: Coverage protection policy
      run: python tools/coverage_protection_policy.py coverage-main_head.xml coverage-merge.xml
