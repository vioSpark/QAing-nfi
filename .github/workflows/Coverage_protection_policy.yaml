name: Coverage protection policy

# Merging a branch into main may not lower line coverage (tools/coverage_protection_policy.py).
on:
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.15'

jobs:
  identify-commit-pair:
    runs-on: ubuntu-latest
    outputs:
      main_head: ${{ steps.identify.outputs.main_head }}
      branch_head: ${{ steps.identify.outputs.branch_head }}
      merge_commit: ${{ steps.identify.outputs.merge_commit }}

    steps:
    # Depth 2: on a pull request this is GitHub's merge commit, and main_head is its first parent.
    - uses: actions/checkout@v7
      with:
        fetch-depth: 2

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        # The runner image caches an older 3.15.x; check for the newest one.
        check-latest: true

    - name: Identify commit pair
      id: identify
      run: python tools/identify_commit_pair.py

  coverage:
    name: coverage (${{ matrix.role }})
    needs: identify-commit-pair
    runs-on: ubuntu-latest
    strategy:
      # A failure on one commit must not cancel the measurement of the other.
      fail-fast: false
      matrix:
        include:
        - role: main_head
          commit: ${{ needs.identify-commit-pair.outputs.main_head }}
        # GitHub's merge commit on a pull request; on a workflow_dispatch branch_head, merged below.
        - role: merge
          commit: ${{ needs.identify-commit-pair.outputs.merge_commit || needs.identify-commit-pair.outputs.branch_head }}

    steps:
    # Full history: merging needs the common ancestor.
    - uses: actions/checkout@v7
      with:
        ref: ${{ matrix.commit }}
        fetch-depth: 0

    # A workflow_dispatch has no merge commit from GitHub: make one the same way. It stays on this runner.
    - name: Merge main_head into branch_head
      if: ${{ matrix.role == 'merge' && needs.identify-commit-pair.outputs.merge_commit == '' }}
      run: |
        git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
          merge --no-ff --no-edit "${{ needs.identify-commit-pair.outputs.main_head }}" \
          || { echo "::error::branch_head has merge conflicts with main_head; resolve them first."; exit 1; }

    # Both commits are measured with branch_head's settings and dependencies: main may not have them yet.
    - name: Coverage settings from branch_head
      run: |
        git fetch --quiet origin "${{ needs.identify-commit-pair.outputs.branch_head }}"
        git show "FETCH_HEAD:.coveragerc" > "$RUNNER_TEMP/.coveragerc"
        git show "FETCH_HEAD:Create automated test/requirements.txt" > "$RUNNER_TEMP/requirements.txt"
        echo "COVERAGE_RCFILE=$RUNNER_TEMP/.coveragerc" >> "$GITHUB_ENV"

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        # The runner image caches an older 3.15.x; check for the newest one.
        check-latest: true

    - name: Install dependencies
      run: python -m pip install -r "$RUNNER_TEMP/requirements.txt"

    # On main_head a failing test neither stops the measurement nor turns the check red: only its coverage is used.
    - name: Run pytest with coverage
      id: tests
      continue-on-error: ${{ matrix.role == 'main_head' }}
      run: python -m coverage run -m pytest "Create automated test"

    - name: Warn about failing tests on main_head
      if: ${{ matrix.role == 'main_head' && steps.tests.outcome == 'failure' }}
      run: echo "::warning::Tests fail on main_head (${{ matrix.commit }}); its coverage is still used."

    - name: Write coverage.xml (Cobertura)
      if: ${{ !cancelled() }}
      run: python -m coverage xml -o coverage.xml

    - name: Upload coverage.xml
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: coverage-${{ matrix.role }}
        path: coverage.xml
        if-no-files-found: error
        retention-days: 7

  enforce-policy:
    needs: coverage
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        # The runner image caches an older 3.15.x; check for the newest one.
        check-latest: true

    # Each artifact lands in a folder named after it: coverage-main_head/, coverage-merge/.
    - name: Download both coverage files
      uses: actions/download-artifact@v8
      with:
        pattern: coverage-*

    - name: Coverage protection policy
      run: python tools/coverage_protection_policy.py coverage-main_head/coverage.xml coverage-merge/coverage.xml
