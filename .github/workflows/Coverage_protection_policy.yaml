name: Coverage protection policy

# A branch may not have lower line coverage than main (tools/coverage_protection_policy.py).
on:
  pull_request:
  workflow_dispatch:

jobs:
  identify-commit-pair:
    runs-on: ubuntu-latest
    outputs:
      main_head: ${{ steps.identify.outputs.main_head }}
      branch_head: ${{ steps.identify.outputs.branch_head }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Identify commit pair
      id: identify
      run: python tools/identify_commit_pair.py

  coverage:
    name: coverage (${{ matrix.role }})
    needs: identify-commit-pair
    runs-on: ubuntu-latest
    strategy:
      # A failure on one commit must not cancel the measurement of the other.
      fail-fast: false
      matrix:
        include:
        - role: main_head
          commit: ${{ needs.identify-commit-pair.outputs.main_head }}
        - role: branch_head
          commit: ${{ needs.identify-commit-pair.outputs.branch_head }}

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ matrix.commit }}

    # Both commits are measured with branch_head's settings and dependencies: main may not have them yet.
    - name: Coverage settings from branch_head
      run: |
        git fetch --quiet --depth=1 origin "${{ needs.identify-commit-pair.outputs.branch_head }}"
        git show "FETCH_HEAD:.coveragerc" > "$RUNNER_TEMP/.coveragerc"
        git show "FETCH_HEAD:Create automated test/requirements.txt" > "$RUNNER_TEMP/requirements.txt"
        echo "COVERAGE_RCFILE=$RUNNER_TEMP/.coveragerc" >> "$GITHUB_ENV"

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: python -m pip install -r "$RUNNER_TEMP/requirements.txt"

    # On main_head a failing test neither stops the measurement nor turns the check red: only its coverage is used.
    - name: Run pytest with coverage
      id: tests
      continue-on-error: ${{ matrix.role == 'main_head' }}
      run: python -m coverage run -m pytest "Create automated test"

    - name: Warn about failing tests on main_head
      if: ${{ matrix.role == 'main_head' && steps.tests.outcome == 'failure' }}
      run: echo "::warning::Tests fail on main_head (${{ matrix.commit }}); its coverage is still used."

    - name: Write coverage.xml (Cobertura)
      if: ${{ !cancelled() }}
      run: python -m coverage xml -o coverage.xml

    - name: Upload coverage.xml
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: coverage-${{ matrix.role }}
        path: coverage.xml
        if-no-files-found: error
        retention-days: 7

  enforce-policy:
    needs: coverage
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # Each artifact lands in a folder named after it: coverage-main_head/, coverage-branch_head/.
    - name: Download both coverage files
      uses: actions/download-artifact@v4
      with:
        pattern: coverage-*

    - name: Coverage protection policy
      run: python tools/coverage_protection_policy.py coverage-main_head/coverage.xml coverage-branch_head/coverage.xml
