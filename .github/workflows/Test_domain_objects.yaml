name: Test domain objects

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
    # Full history: the coverage protection policy needs origin/main and the branch's head commit.
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      working-directory: Create automated test
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    # From the repository root, so the paths in coverage.xml are relative to it (see .coveragerc).
    - name: Run pytest with coverage
      id: tests
      run: python -m coverage run -m pytest "Create automated test"

    # The steps below also run when tests fail; the failed test step still fails the job.
    - name: Write coverage.xml (Cobertura)
      id: xml
      if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
      run: python -m coverage xml -o coverage.xml

    - name: Upload coverage.xml
      if: ${{ !cancelled() && steps.xml.outcome == 'success' }}
      uses: actions/upload-artifact@v4
      with:
        name: coverage-xml-py${{ matrix.python-version }}
        path: coverage.xml
        if-no-files-found: error
        retention-days: 7

    - name: Coverage summary
      if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
      run: |
        echo "### Coverage, Python ${{ matrix.python-version }}" >> "$GITHUB_STEP_SUMMARY"
        python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

    # A branch may not have lower line coverage than main (tools/coverage_protection_policy.py).
    - name: Coverage protection policy
      if: ${{ github.event_name != 'push' }}
      run: python tools/coverage_protection_policy.py
